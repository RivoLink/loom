[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "1.0.0"
description = "A generic, configuration-driven scraping service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RivoLink" }]
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.11",
    "pyyaml>=6",
    "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx2>=2.9",
]

[tool.setuptools.packages.find]
include = ["loom*"]
exclude = ["tests*"]
